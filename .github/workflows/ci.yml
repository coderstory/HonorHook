name: build

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # JDK 21：与 tools/README.md 声明的工具链要求一致（release 打包需要含 jlink 的完整 JDK）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 托管镜像已预装 Android SDK（/usr/local/lib/android/sdk，许可证已预授权），
      # 缺失的 platform/build-tools 由 AGP 在构建时自动补齐，无需 setup-android action。

      # Gradle 缓存层：GRADLE_USER_HOME（依赖包 + wrapper 发行版）跨 run 复用；
      # 缓存 key 随 *.gradle* / gradle-wrapper.properties / libs.versions.toml 变化自动滚动。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: ver
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION"

      # dev 分支：编译 debug + 单测
      - name: Build debug (dev)
        if: github.ref_name == 'dev'
        run: ./app/gradlew -p app assembleDebug --no-daemon --stacktrace

      # 单测门禁（dev + master 均跑，master 发布前必须通过）
      - name: Run tests
        run: ./app/gradlew -p app test --no-daemon --stacktrace

      - name: Upload debug APK (dev)
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.run_number }}
          path: app/app/build/outputs/apk/debug/app-debug.apk

      # master 分支：编译 release 并发 GitHub Release
      # -PbuildNum：run_number 注入 BuildConfig.BUILD_NUM，与 tag v<version>.r<N> 对齐供在线更新对比
      # 签名：稳定 keystore 从 Secrets 注入（签名跨 run 一致 = 在线更新可覆盖安装；
      # debug keystore 在 CI 每次随机生成，不可用于发布）。
      - name: Decode signing keystore (master)
        if: github.ref_name == 'master'
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORHOOK_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honorhook-release.jks"

      - name: Build release (master)
        if: github.ref_name == 'master'
        env:
          HH_STORE_PASSWORD: ${{ secrets.HONORHOOK_STORE_PASSWORD }}
          HH_KEY_ALIAS: ${{ secrets.HONORHOOK_KEY_ALIAS }}
          HH_KEY_PASSWORD: ${{ secrets.HONORHOOK_KEY_PASSWORD }}
        run: |
          ./app/gradlew -p app assembleRelease -PbuildNum=${{ github.run_number }} \
            -PhhKeystoreFile="$RUNNER_TEMP/honorhook-release.jks" \
            -PhhStorePassword="$HH_STORE_PASSWORD" \
            -PhhKeyAlias="$HH_KEY_ALIAS" \
            -PhhKeyPassword="$HH_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Publish release (master)
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}.r${{ github.run_number }}
          name: v${{ steps.ver.outputs.version }}.r${{ github.run_number }}
          body: |
            自动构建（run #${{ github.run_number }}，commit ${{ github.sha }}）

            - 模块版本：${{ steps.ver.outputs.version }}
            - 宿主基线：主题商店 20.1.63.305 / 包管理器 14.0.37.301 / 系统桌面 18.0.0.234 /
              成人高考题库 5.9.0.0-release
            - 安装：LSPosed 管理器导入 APK，启用模块后勾选全部 6 个作用域
              （主题商店 / 包管理器 / 设置 / SystemUI / 系统桌面 / 成人高考题库）
            - 判据：LSPosed 框架日志 `/data/adb/lspd/log/modules_*.log` 里的 `installed N/M`
          files: app/app/build/outputs/apk/release/app-release.apk
          make_latest: true
