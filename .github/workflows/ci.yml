name: build

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

# 同一分支只保留最新一次：连续 push 时旧跑自动取消（否则 dev 一天十几次 commit
# 会把队列堆满、后到的一次要等前面全跑完）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 兜底：任何步骤卡住（历史事故：一个直接扫 /sdcard 的计时测试在 runner 上挂了 23 分钟
    # 才被手动取消）都不该拖满 6 小时默认上限。
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 不用 submodules: true —— 另一个 submodule 路径含全角括号
          # （reference/LSPosed（框架源码））会让 actions/checkout 的
          # "Persisting credentials for submodules" 步骤 ENOENT 失败（2026-10-20 实测 CI 红）。
          # 构建只需要 XHS 那一个（:xhs-dn-core 的源码供给），下面单独精确检出。
          submodules: false

      # 构建依赖的上游 submodule：XHS_Downloader_Android（:xhs-dn-core 的唯一源码供给，
      # 见 libs/xhs-dn-core/build.gradle.kts）。LSPosed 框架源码是只读逆向参考，不参与构建。
      - name: Checkout 构建依赖的 submodule
        run: git submodule update --init --depth=1 reference/xhs/XHS_Downloader_Android

      # 工具脚本自身的门禁：dev.sh 语法 + tools/*.py 可编译。
      # 这些脚本不进 APK，坏掉不会让构建变红，但会静默毁掉判据/适配流程（2026-11-07 的
      # grep -m1 + SIGPIPE 事故就是这类：脚本自己 exit 0 却一行不打印）。
      - name: Lint tools scripts
        run: |
          bash -n tools/dev.sh
          python3 -m py_compile tools/*.py
          echo "tools scripts OK"

      # JDK 21：与 tools/README.md 声明的工具链要求一致（release 打包需要含 jlink 的完整 JDK）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 托管镜像已预装 Android SDK（/usr/local/lib/android/sdk，许可证已预授权），
      # 缺失的 platform/build-tools 由 AGP 在构建时自动补齐，无需 setup-android action。

      # Gradle 缓存层：GRADLE_USER_HOME（依赖包 + wrapper 发行版）跨 run 复用；
      # 缓存 key 随 *.gradle* / gradle-wrapper.properties / libs.versions.toml 变化自动滚动。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 发布标识 = v<versionName>，唯一事实源 app/app/version.properties（仅 skill `release` 写）。
      # 读属性文件而非 grep 源码（r50 教训：构建期求值表达式 grep 到的是未求值字面量）；
      # 属性值是纯字面量，grep 安全。
      - name: Read release version
        id: rel
        run: |
          VN=$(grep -E '^versionName=' app/app/version.properties | cut -d= -f2 | tr -d ' \r')
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN"

      # dev 分支：编译 debug + 单测
      - name: Build debug (dev)
        if: github.ref_name == 'dev'
        run: ./app/gradlew -p app assembleDebug --stacktrace

      # 单测门禁（P1-2 整改 #10）：dev 与 master 都跑测试，统一收敛为 testDebugUnitTest
      # （与 tools/dev.sh test 口径对齐、缩短门禁；master 的测试步骤在 release 构建之前）
      - name: Run tests (dev)
        if: github.ref_name == 'dev'
        run: ./app/gradlew -p app testDebugUnitTest --stacktrace

      - name: Upload debug APK (dev)
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.run_number }}
          path: app/app/build/outputs/apk/debug/app-debug.apk
          # 免费档 Actions 存储仅 0.5GB：debug 产物只供装机自测，3 天过期防积压
          retention-days: 3

      # master 分支：编译 release 并发 GitHub Release
      # 版本 = version.properties（唯一事实源，skill release 写）；在线更新按 tag 语义版本比大小（UpdateChecker）
      # 签名：稳定 keystore 从 Secrets 注入（签名跨 run 一致 = 在线更新可覆盖安装；
      # debug keystore 在 CI 每次随机生成，不可用于发布）。
      # master 单测门禁（P1-2 整改 #10）：发布链路不再零测试——
      # 测试红则后续 Build release / 发 Release / 同步 XMRepo 全部不执行
      - name: Run tests (master)
        if: github.ref_name == 'master'
        run: ./app/gradlew -p app testDebugUnitTest --stacktrace

      - name: Decode signing keystore (master)
        if: github.ref_name == 'master'
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORHOOK_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honorhook-release.jks"

      - name: Build release (master)
        if: github.ref_name == 'master'
        env:
          HH_STORE_PASSWORD: ${{ secrets.HONORHOOK_STORE_PASSWORD }}
          HH_KEY_ALIAS: ${{ secrets.HONORHOOK_KEY_ALIAS }}
          HH_KEY_PASSWORD: ${{ secrets.HONORHOOK_KEY_PASSWORD }}
        run: |
          ./app/gradlew -p app assembleRelease \
            -PhhKeystoreFile="$RUNNER_TEMP/honorhook-release.jks" \
            -PhhStorePassword="$HH_STORE_PASSWORD" \
            -PhhKeyAlias="$HH_KEY_ALIAS" \
            -PhhKeyPassword="$HH_KEY_PASSWORD" \
            --stacktrace

      # release notes = 仓库根 RELEASE_NOTES.md（skill `release` 每次发布重写；源仓库与 Xposed-Modules-Repo 共用）
      - name: Publish release (master)
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: app/app/build/outputs/apk/release/app-release.apk
          make_latest: true

      # 同步发布到 Xposed-Modules-Repo（xposedmodules.org 索引源，repo 名 = 模块包名）
      # Secret XMREPO_TOKEN：fine-grained PAT，仅授权目标仓库，Contents: Read and write
      # 幂等：workflow 重跑且 tag 已存在时不再建 release，只覆盖上传 APK
      - name: Publish release to Xposed-Modules-Repo (master)
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ secrets.XMREPO_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          NOTES: RELEASE_NOTES.md
          APK: app/app/build/outputs/apk/release/app-release.apk
        run: |
          REPO=Xposed-Modules-Repo/io.github.coderstory.honorhook
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$APK" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
