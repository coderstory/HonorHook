# HonorHook 版本目录 —— 纯 hook 模块：仅 libxposed api（编译期）+ DexKit
[versions]
agp = "9.2.1"
kotlin = "2.3.21"
libxposed = "102.0.0"
dexkit = "2.2.0"

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
